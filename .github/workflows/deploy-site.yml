name: Deploy site

# Builds the app and publishes dist/ to the `site` branch (the GitHub Pages source).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to push the built site to the `site` branch.
permissions:
  contents: write

# Never run two deploys at once; cancel superseded ones.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with runtime submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to site branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: site
          folder: dist
          # Keep the branch clean (built output only); this is a generated branch.
          clean: true
