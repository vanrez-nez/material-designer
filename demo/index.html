<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Material Designer Runtime — demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f17; }
      #app { position: fixed; inset: 0; }
      .toolbar {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        max-width: calc(100vw - 24px);
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(13, 17, 23, 0.85);
        color: #e6edf3;
        font-family: system-ui, sans-serif;
        font-size: 12px;
      }
      .toolbar .group { display: flex; gap: 6px; align-items: center; }
      .toolbar .label { color: #8b949e; }
      .toolbar button, .toolbar select {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      .toolbar button[data-active="true"] { background: #1f6feb; border-color: #1f6feb; }
      .toolbar .sep { width: 1px; height: 18px; background: #30363d; }
      .toolbar input[type="range"] { width: 110px; }
      #scale-group[hidden] { display: none; }
      #status { color: #f0b429; min-width: 5rem; }
      #status[data-kind="restored"] { color: #3fb950; }
      #status[data-kind="baked"] { color: #58a6ff; }
      .stats {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(13, 17, 23, 0.85);
        color: #8b949e;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.6;
        white-space: pre;
      }
      .stats b { color: #e6edf3; font-weight: 600; }
      .stats .off { color: #6e7681; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="group">
        <span class="label">Material</span>
        <select id="sample" aria-label="Sample material"></select>
      </div>
      <span class="sep"></span>
      <div class="group">
        <span class="label">Shape</span>
        <button id="geo-sphere" data-active="true" type="button">Sphere</button>
        <button id="geo-box" type="button">Box</button>
        <button id="geo-plane" type="button">Plane</button>
      </div>
      <span class="sep"></span>
      <div class="group">
        <span class="label">Res</span>
        <select id="resolution" aria-label="Output resolution">
          <option value="512">512</option>
          <option value="1024" selected>1024</option>
          <option value="2048">2048</option>
        </select>
      </div>
      <span class="sep"></span>
      <div class="group" id="scale-group" hidden>
        <span class="label">Scale</span>
        <input id="scale" type="range" min="1" max="64" step="1" value="8" aria-label="Noise scale" />
      </div>
      <span class="sep"></span>
      <div class="group">
        <button id="load" type="button">Load .json…</button>
        <input id="load-input" type="file" accept=".json,application/json" hidden />
      </div>
      <span class="sep"></span>
      <div class="group">
        <span class="label">Cache</span>
        <button id="cache-toggle" type="button" aria-pressed="false">Off</button>
        <button id="cache-rebuild" type="button" title="Re-bake for real and replace this document's entry">Rebuild</button>
        <button id="cache-clear" type="button" title="Drop every cached bake">Clear</button>
      </div>
      <span id="status"></span>
    </div>
    <div id="app"></div>
    <div class="stats" id="cache-stats"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
